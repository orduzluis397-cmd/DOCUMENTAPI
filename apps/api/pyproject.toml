[project]
name = "contable-ia-api"
version = "0.1.0"
description = "API de Contable IA: Document AI contable para pymes colombianas (FastAPI + Celery)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.123",
    "celery>=5.6.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.123",
    "celery-types>=0.26.0",
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "S", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "fast: pruebas rápidas para CI",
]
