name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Instalar Python 3.12 y dependencias
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app tests

      # Mismo Postgres que en local: imagen pgvector fijada en compose y los scripts de
      # infra/postgres/initdb (rol contable_app sin BYPASSRLS y base contable_ia_test).
      - name: Postgres (docker compose)
        working-directory: .
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait postgres
          # El healthcheck usa el socket local y puede pasar mientras corre initdb; se espera a
          # que el rol de la app entre por TCP a la base de pruebas.
          for i in $(seq 1 30); do
            if docker compose -f infra/docker-compose.yml exec -T -e PGPASSWORD=contable_app_local \
                postgres psql -h 127.0.0.1 -U contable_app -d contable_ia_test -c 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs postgres
          exit 1

      - name: pytest
        env:
          REQUIRE_DB: "1"
        run: uv run pytest

      - name: Logs de Postgres (si falla)
        if: failure()
        working-directory: .
        run: docker compose -f infra/docker-compose.yml logs postgres

  ml:
    name: ML · anonimizador (prueba rápida, sin modelo spaCy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: ml/uv.lock

      # Sin el grupo `modelo` (es_core_news_lg, ~540 MB): solo reconocedores regex.
      - name: Instalar Python 3.12 y dependencias
        run: |
          uv python install 3.12
          uv sync --locked --no-group modelo

      - name: Ruff (lint)
        run: uv run --no-sync ruff check .

      - name: Ruff (formato)
        run: uv run --no-sync ruff format --check .

      - name: mypy
        run: uv run --no-sync mypy anonymize.py tests

      - name: pytest (sin pruebas del modelo)
        run: uv run --no-sync pytest -m "not modelo"

  web:
    name: Web · lint, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - name: Instalar Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  secrets:
    name: Secretos · gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${tarball}" gitleaks
          ./gitleaks git . --redact --verbose

  repo:
    name: Repo · pre-commit y data/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Regla dura 1 (CLAUDE.md): nada de data/ en el repositorio.
      - name: data/ vacío en el repositorio
        run: |
          tracked="$(git ls-files data/)"
          if [ -n "${tracked}" ]; then
            echo "::error::Hay archivos de data/ versionados (CLAUDE.md, regla 1):"
            echo "${tracked}"
            exit 1
          fi

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Dependencias de la API (trae pre-commit)
        working-directory: apps/api
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Caché de pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Hooks genéricos, Ruff y no-data. mypy, Prettier, ESLint y gitleaks ya corren en sus
      # propios jobs (los hooks locales necesitarían pnpm aquí).
      - name: pre-commit
        env:
          SKIP: mypy,mypy-ml,prettier,eslint,gitleaks
        run: uv run --directory apps/api pre-commit run --all-files --show-diff-on-failure
