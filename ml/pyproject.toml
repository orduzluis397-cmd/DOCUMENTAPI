[project]
name = "contable-ia-ml"
version = "0.1.0"
description = "Herramientas locales de datos y ML de Contable IA (anonimizador, entrenamiento). Nunca se despliegan."
requires-python = ">=3.12,<3.13"
# PyMuPDF (AGPL-3.0) solo aquí, de ejecución local (CR-003). Nunca en apps/.
dependencies = [
    "cryptography>=50.0.2",
    "faker>=40.44.0",
    "lxml>=6.1.3",
    "presidio-analyzer>=2.2.366",
    "pymupdf>=2.1",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
# Modelo spaCy grande (~540 MB). La CI lo omite: `uv sync --locked --no-group modelo`.
modelo = [
    "es-core-news-lg",
]

[tool.uv]
package = false
default-groups = ["dev", "modelo"]

[tool.uv.sources]
es-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_lg-3.8.0/es_core_news_lg-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "S", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.pep8-naming]
# Excepciones con nombre en español (ErrorAnonimizacion)
extend-ignore-names = ["Error*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "tests"
# PyMuPDF trae tipos parciales; sus funciones sin anotar no rompen el modo estricto.
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "modelo: requiere el modelo spaCy es_core_news_lg (lento; fuera de la CI)",
]
